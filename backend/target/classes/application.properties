spring.application.name=wms-v3

# ==================== 服务端口 ====================
# 第三版独立端口，避免与第二版（8080）冲突
server.port=8081

# ==================== 数据源 ====================
# 第三版使用独立数据库 wms_v3（启动自动建库建表 + 种子数据）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/wms_v3?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== HikariCP 连接池 ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=WmsV3HikariPool

# ==================== 开发期日志 ====================
logging.level.com.example.wms=INFO
