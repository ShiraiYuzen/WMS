spring.application.name=wms

# ==================== 服务端口 ====================
server.port=8080

# ==================== 数据源 ====================
# MySQL 8.0.46 本地服务（Windows 服务 MySQL80，端口 3306）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/wms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== HikariCP 连接池 ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=WmsHikariPool

# ==================== 开发期日志 ====================
logging.level.com.example.wms=INFO
