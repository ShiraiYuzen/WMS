spring.application.name=wms-v4

# Optional local overrides, git-ignored. Put machine-specific credentials in
# backend/application-local.properties and they are picked up automatically.
spring.config.import=optional:file:./application-local.properties

# ==================== Server port ====================
# 8080 pairs with the Vite dev proxy on 5173.
# Note: an exported SERVER__PORT environment variable outranks this value,
# so always pass --server.port=8080 explicitly when starting the jar.
server.port=${SERVER_PORT:8080}

# ==================== Data source ====================
# Dedicated database for v4. Schema and seed data are created automatically on
# first startup (createDatabaseIfNotExist=true + DatabaseInitializer).
# Credentials are intentionally NOT stored here: provide them through the
# WMS_DB_USER / WMS_DB_PASS environment variables, an IDE run configuration,
# or a git-ignored application-local.properties.
spring.datasource.url=${WMS_DB_URL:jdbc:mysql://127.0.0.1:3306/wms_v4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${WMS_DB_USER:root}
spring.datasource.password=${WMS_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== HikariCP pool ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=WmsV4HikariPool

# ==================== Logging ====================
# Raise com.example.wms to DEBUG when troubleshooting.
logging.level.com.example.wms=INFO
